[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sessionkit"
description = "Accounts, opaque server-side sessions, and opt-in TOTP two-factor auth."
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Andrew Townsend" }]
dynamic = ["version"]
dependencies = [
    "pyotp>=2.9",
    "argon2-cffi>=23",
]
classifiers = [
    "Programming Language :: Python :: 3.13",
    "Intended Audience :: Developers",
    "Topic :: Security",
    "Typing :: Typed",
]

[project.urls]
Source = "https://github.com/atownsend247/bb-py-sessionkit"
Issues = "https://github.com/atownsend247/bb-py-sessionkit/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
]

[project.scripts]
sessionkit = "sessionkit.cli:main"

# --- Hatch --------------------------------------------------------------

[tool.hatch.version]
path = "src/sessionkit/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/sessionkit"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md"]

[tool.hatch.envs.default]
features = ["dev"]

[tool.hatch.envs.default.scripts]
test = "pytest {args}"

# --- pytest ---------------------------------------------------------------

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = [
    # the CLI opens a store per invocation and relies on process exit / GC to
    # close it; in a test run that shows up as GC-time noise, not a real leak.
    "ignore:unclosed database:ResourceWarning",
]

# --- coverage ---------------------------------------------------------------

[tool.coverage.run]
source = ["sessionkit"]
branch = true
omit = ["*/sessionkit/__main__.py"]

[tool.coverage.report]
fail_under = 90
show_missing = true
